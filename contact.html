<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Group 17</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <header class="plasma-window">
        <h1>Inquiries</h1>
        <p>Secure communications channel</p>
    </header>

    <main>
        <section class="content-box plasma-window">
            <h2>Contact Directory</h2>
            <p>Use the secure form below to reach out to Group 17 regarding our digital forensics project data.</p>
            
            <form action="#" method="POST" class="contact-form" style="margin-top: 2rem;">
                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your identity" required>
                </div>
                
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter return address" required>
                </div>

                <button type="submit">Submit Request</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Group 17. Research documentation.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
